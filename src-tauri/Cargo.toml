[package]
name = "elytra"
version = "1.0.0"
description = "A modern, lightweight Minecraft launcher built with Tauri and Rust, providing a great option for Linux and cross-platform users."
authors = ["BridgeFishDev"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "elytra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
base64 = "0.22"
url = "2"
percent-encoding = "2"
getrandom = "0.2"
zip = "2"
# JDK 包解压：Adoptium（Temurin）的 mac/linux 仅提供 tar.gz（官方 API 返回的包
# 格式 zip/tar.gz 随平台变化），需 tar + flate2（纯 Rust，flate2 默认 miniz_oxide 后端）
tar = "0.4"
flate2 = "1"
# 安装任务持久化（#6）：SQLite 存任务快照，崩溃/重启后恢复。
# 运行时 SqlitePoolOptions（无 migrate 宏）；与 TOML 并存期间 Settings.toml 读写路径不动
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# 锁：立即 unwrap 的场景用 parking_lot（无 poisoning 路径，guard 更小更快）
parking_lot = "0.12"
# 读 Windows 系统代理（注册表 Internet Settings）：reqwest 默认不读系统代理，
# 用户开着系统代理（Clash 等）时官方源直连被劫持/黑洞，需显式走代理
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 非 Windows 钥匙串主密钥加密：secrets.bin 每条 value 用主密钥 ChaCha20-Poly1305 加密
# （主密钥存系统钥匙串；无钥匙串环境降级明文 + 0o600）
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
chacha20poly1305 = "0.11"
# macOS 系统钥匙串（Keychain Services）；security-framework 不重导出 core-foundation，需显式声明
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"
# Linux Secret Service（org.freedesktop.secrets：GNOME Keyring / KWallet kwalletd5）
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", default-features = false, features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# 解压/安装流程单测用临时目录（仅测试，不进入产物）
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
