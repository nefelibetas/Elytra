[package]
name = "Elytra"
version = "1.0.0"
description = "A modern, lightweight Minecraft launcher built with Tauri and Rust, providing a great option for Linux and cross-platform users."
authors = ["BridgeFishDev"]
edition = "2021"
license = "GPL-3.0"

# 显式默认 bin：`src/bin/gen_ts.rs` 让包内出现两个 bin（elytra / gen_ts），
# 而 tauri-cli 的 dev 只发 `cargo run --no-default-features`（不带 --bin），
# 缺 default-run 时 cargo 会以 "could not determine which binary to run" 失败。
default-run = "elytra"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "elytra_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
# 显式小写 bin 名：默认随 package 名（Elytra 大写）会与配置目录
# exe_dir()/Elytra（config_dir）在 dev 下撞名——cargo 产物文件 vs 配置目录
# 互删互炸（Is a directory / File exists）。小写 elytra 与配置目录区分。
name = "elytra"
path = "src/main.rs"

[[bin]]
# TS 类型生成工具，默认不构建：tauri-cli 会把包内所有 bin（含 src/bin/* 扫描结果）
# 当作要打进安装包的附加二进制，macOS bundler 逐个 copy 进 Contents/MacOS；
# 而 universal 构建只产出主二进制 → 「Failed to copy binary from .../gen_ts」打包失败。
# 用 required-features 让它进 tauri-cli 的 disabled_bins（tauri-cli rust.rs:939 + matches_src_bin，
# 上游有同名测试 get_binaries_ignores_src_bin_with_disabled_required_features）。
# 需要时：`cargo run --bin gen_ts --features gen-ts`
name = "gen_ts"
path = "src/bin/gen_ts.rs"
required-features = ["gen-ts"]

[features]
# 仅用于开启 TS 类型生成工具；应用自身不依赖任何 feature
gen-ts = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
# 单实例：二次启动聚焦已有窗口并由第二实例自行退出。配置与任务快照均为整段读-改-写，
# 跨进程无锁，多开会互相覆盖
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
reqwest = { version = "0.13.4", features = ["json", "stream", "gzip", "http2", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
serde_json = "1"
# Rust → TypeScript 类型导出（前端 interface 自动生成，替代手写镜像）：
# #[derive(TS)] + #[ts(export)] 在 cargo test 时输出 .ts 到 src/types/
ts-rs = "10"
sha1 = "0.10"
sha2 = "0.10"
# 联机房间码（online/scaffold/room.rs）：uuid 生成房间码短码；
# 网络名/密钥由房间码**明文映射**（非 HMAC 派生），故不再依赖 hmac
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
url = "2"
percent-encoding = "2"
getrandom = "0.2"
# JDK 包解压：zip crate。默认 features 含 lzma/xz/zstd，会与 easytier 的 liblzma-sys 冲突
# （links=lzma 冲突），Minecraft/JDK 生态 zip 均为 deflate 压缩，故关默认只留
# deflate/bzip2/aes-crypto/time
zip = { version = "2", default-features = false, features = ["deflate", "bzip2", "aes-crypto", "time"] }
# JDK 包解压：Adoptium（Temurin）的 mac/linux 仅提供 tar.gz（官方 API 返回的包
# 格式 zip/tar.gz 随平台变化），需 tar + flate2（纯 Rust，flate2 默认 miniz_oxide 后端）
tar = "0.4"
flate2 = "1"
# 安装任务持久化（#6）：SQLite 存任务快照，崩溃/重启后恢复。
# 运行时 SqlitePoolOptions（无 migrate 宏）；与 TOML 并存期间 Settings.toml 读写路径不动
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
# 游戏目录变化监听（game/version/watch.rs）：非递归 watch `versions/` 与聚焦版本子目录。
# 平台后端 ReadDirectoryChangesW / inotify / FSEvents；事件驱动，空闲不轮询不占 CPU
notify = "8"
# 锁：立即 unwrap 的场景用 parking_lot（无 poisoning 路径，guard 更小更快）
parking_lot = "0.12"
# 联机（#online）：EasyTier 库内嵌虚拟局域网 + 端口转发。
# 剔 tun feature：纯用户态 no_tun+smoltcp+socks5，无需 wintun 驱动/管理员权限。
# socks5 = gateway 启用开关（gateway_enabled 由 cfg!(feature="socks5") 决定），端口转发依此启动；
# management = 实例事件订阅；aes-gcm = 加密；quic = 传输协议。
# kcp = port_forward 数据面首选传输（DataPlaneTcpConnectOptions::gateway 为 PreferKcp）：
#   缺 kcp feature 时 kcp_ready=false，回退 smoltcp 用户态 TCP 栈，
#   MC 登录配置同步（registry 数百 KB~数 MB）传输会中断（实测"连接中断"）。
easytier = { git = "https://github.com/EasyTier/EasyTier", default-features = false, features = ["management", "socks5", "smoltcp", "kcp", "quic", "websocket", "logging", "aes-gcm"] }
easytier-core = { git = "https://github.com/EasyTier/EasyTier", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# 读 Windows 系统代理（注册表 Internet Settings）：reqwest 默认不读系统代理，
# 用户开着系统代理（Clash 等）时官方源直连会被劫持/黑洞，需显式走代理
[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# 非 Windows 钥匙串主密钥加密：secrets.bin 每条 value 用主密钥 ChaCha20-Poly1305 加密
# （主密钥存系统钥匙串；无钥匙串环境降级明文 + 0o600）
[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
chacha20poly1305 = "0.11"
# macOS 系统钥匙串（Keychain Services）；security-framework 不重导出 core-foundation，需显式声明
[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
core-foundation = "0.10"
# Linux Secret Service（org.freedesktop.secrets：GNOME Keyring / KWallet kwalletd5）
[target.'cfg(target_os = "linux")'.dependencies]
secret-service = { version = "5.1", features = ["rt-tokio-crypto-rust"] }

[dev-dependencies]
# 解压/安装流程单测用临时目录（仅测试，不进入产物）。
# 注：serde_json / tokio / parking_lot 无需在此重复声明——集成测试同样能使用
# [dependencies]（tokio 主依赖的 "full" 已覆盖 macros / rt-multi-thread）。
tempfile = "3"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
