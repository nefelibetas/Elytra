name: Release

# 唯一触发方式：推 v* tag（手动 dispatch 仅供维护者按需重跑，产物只落 Actions artifacts）。
# 工具链版本一律取自 mise.toml（node / pnpm / rust / protoc），本文件不写死版本号。
#
# 四个 job：
#   check   验证门（复用 check.yml）：frontend 平台无关检查（只跑一次）+ Windows 全量 clippy/test
#           + Linux/macOS clippy（覆盖平台 cfg 分支；test 仍只在 Windows）
#   prepare needs check：tag 上创建草稿 Release（唯一创建点，避免三平台并发 create 竞争）
#   build   needs prepare；三平台并行打包：
#             Windows  便携 zip + NSIS + MSI
#             macOS    universal dmg（ad-hoc 签名：Apple Silicon 上未签名二进制无法启动）
#             Linux    AppImage + deb + rpm + 便携 tar.gz（固定 ubuntu-22.04，取该发行版的 glibc 下限）
#   publish needs [prepare, build]：三平台产物齐了且验证门通过，生成 release.json
#             （静态更新清单）后把草稿 Release 转正；任一环节失败 Release 停在草稿
#
# 想重跑同版本：`git tag -f v1.0.0 <新提交> && git push -f origin v1.0.0`
# （版本校验要求 tag 与 tauri.conf.json 的版本一致，故不能随便换个新 tag 号重跑）
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # gh release create/upload/edit 需要

jobs:
  check:
    name: 验证门
    uses: ./.github/workflows/check.yml

  prepare:
    name: 创建草稿 Release
    needs: check
    runs-on: ubuntu-latest
    steps:
      # 唯一创建点：三平台 build 并行时各自 `gh release create` 会互相竞争（先 view 再 create 仍有竞态）
      - name: 创建草稿 Release（tag）
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --draft -R "$GITHUB_REPOSITORY" \
                 --title "Elytra Launcher $GITHUB_REF_NAME" --generate-notes

  build:
    name: 打包 ${{ matrix.name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            bundles: nsis,msi
            mise_rustup_home: 'C:\Users\runneradmin\AppData\Local\mise\rustup'
          - name: macos-universal
            os: macos-latest
            bundles: dmg
            target: universal-apple-darwin
            mise_rustup_home: /Users/runner/.local/share/mise/rustup
          - name: linux-x64
            os: ubuntu-22.04 # 用 22.04 而非 latest：AppImage/deb 的 glibc 下限跟构建机走
            bundles: deb,rpm,appimage
            mise_rustup_home: /home/runner/.local/share/mise/rustup
    env:
      MISE_RUSTUP_HOME: ${{ matrix.mise_rustup_home }}
      # macOS 无证书时的 ad-hoc 签名；Windows/Linux 忽略此变量
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v5

      - uses: jdx/mise-action@v5
        with:
          install_args: "node npm:pnpm rust protoc"

      - name: 确保 7-Zip 可用（easytier 构建依赖，Windows）
        if: startsWith(matrix.os, 'windows')
        shell: bash
        run: |
          if [ -f "/c/Program Files/7-Zip/7z.exe" ]; then
            echo "C:/Program Files/7-Zip" >> "$GITHUB_PATH"
          else
            choco install 7zip -y
            echo "C:/Program Files/7-Zip" >> "$GITHUB_PATH"
          fi

      - name: 安装 7-Zip（easytier 构建依赖，macOS）
        if: startsWith(matrix.os, 'macos')
        run: brew list p7zip >/dev/null 2>&1 || brew install p7zip

      - name: Linux 系统依赖（Tauri v2 前置 + kcp-sys 的 bindgen）
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          # 指示器库用 libappindicator3-dev（Tauri 官方 pipeline 示例即此名，已确认 jammy 存在）——
          # libappindicator-sys 只在运行时 dlopen .so、不读 .pc，这里只是满足打包/运行时依赖
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf xdg-utils file libclang-dev p7zip-full

      - name: macOS 双架构 target（universal 需要）
        if: matrix.target == 'universal-apple-darwin'
        run: mise exec -- rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~/AppData/Local/pnpm/store' || '~/.local/share/pnpm/store' }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: 写入 .env（构建期密钥）
        # src-tauri/build.rs 会读仓库根 .env，逐行 rustc-env=KEY=VALUE 注入（constants.rs 用 option_env! 取）
        shell: bash
        env:
          ELYTRA_CURSEFORGE_API_KEY: ${{ secrets.ELYTRA_CURSEFORGE_API_KEY }}
        run: |
          missing=""
          [ -n "$ELYTRA_CURSEFORGE_API_KEY" ] || missing="$missing ELYTRA_CURSEFORGE_API_KEY"
          if [ -n "$missing" ]; then
            echo "::error::缺少 secrets:$missing —— .env 缺失不会让构建失败，但 CurseForge 源会静默降级"
            exit 1
          fi
          printf 'ELYTRA_CURSEFORGE_API_KEY=%s\n' "$ELYTRA_CURSEFORGE_API_KEY" > .env

      - name: 校验版本号（三处一致 + 与 tag 一致）
        id: ver
        shell: bash
        run: |
          CONF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          PKG=$(node -p "require('./package.json').version")
          CARGO=$(grep -m1 -E '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          if [ "$CONF" != "$PKG" ] || [ "$CONF" != "$CARGO" ]; then
            echo "::error::版本号不一致：tauri.conf.json=$CONF package.json=$PKG Cargo.toml=$CARGO"
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ] && [ "v$CONF" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与版本号 $CONF 不符（应为 v$CONF）"
            exit 1
          fi
          echo "version=$CONF" >> "$GITHUB_OUTPUT"

      - run: pnpm install --frozen-lockfile

      - name: pnpm tauri build
        shell: bash
        run: pnpm tauri build --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      - name: 收集产物 → artifacts/（Windows）
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $V = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force artifacts | Out-Null
          # 便携版：Tauri 不产出，取 cargo 的裸 exe（前端资源已内嵌；运行需系统有 WebView2）
          Compress-Archive -Path "src-tauri/target/release/Elytra Launcher.exe" `
            -DestinationPath "artifacts/Elytra-Launcher_${V}_windows-x64_portable.zip"
          Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/nsis/*-setup.exe").FullName `
            "artifacts/Elytra-Launcher_${V}_windows-x64_setup.exe"
          Copy-Item (Get-ChildItem "src-tauri/target/release/bundle/msi/*.msi").FullName `
            "artifacts/Elytra-Launcher_${V}_windows-x64.msi"

      - name: 收集产物 → artifacts/（macOS）
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "artifacts/Elytra-Launcher_${V}_macos-universal.dmg"

      - name: 收集产物 → artifacts/（Linux）
        if: startsWith(matrix.os, 'ubuntu')
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts
          cp src-tauri/target/release/bundle/appimage/*.AppImage "artifacts/Elytra-Launcher_${V}_linux-x64.AppImage"
          cp src-tauri/target/release/bundle/deb/*.deb           "artifacts/Elytra-Launcher_${V}_linux-x64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm           "artifacts/Elytra-Launcher_${V}_linux-x64.rpm"
          # 便携版：裸二进制（依赖系统 webkit2gtk 等运行库，发行版无关）
          tar -czf "artifacts/Elytra-Launcher_${V}_linux-x64_portable.tar.gz" \
            -C src-tauri/target/release "Elytra Launcher"

      - uses: actions/upload-artifact@v6
        with:
          name: Elytra-Launcher_${{ steps.ver.outputs.version }}_${{ matrix.name }}
          path: artifacts/*
          if-no-files-found: error

      - name: 上传产物到草稿 Release（tag）
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber -R "$GITHUB_REPOSITORY"

  publish:
    name: 发布 Release
    needs: [prepare, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: 应用版本 Release notes（存在则覆盖自动生成）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          NOTES="docs/release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            gh release edit "$GITHUB_REF_NAME" --notes-file "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            echo "未找到 $NOTES，保留 --generate-notes 自动正文"
          fi
      - name: 生成并上传 release.json（静态更新清单）
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          TAG="$GITHUB_REF_NAME"
          VERSION="${TAG#v}"
          PAGE="https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          PUBLISHED="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BODY="$(mktemp)"
          gh release view "$TAG" --json body -q .body -R "$GITHUB_REPOSITORY" > "$BODY"
          python3 - "$BODY" "$VERSION" "$PUBLISHED" "$PAGE" <<'PY'
          import json, sys
          body_path, version, published, page = sys.argv[1:5]
          with open(body_path, encoding="utf-8") as f:
              notes = f.read().strip()
          with open("release.json", "w", encoding="utf-8") as f:
              json.dump({
                  "version": version,
                  "notes": notes,
                  "published_at": published,
                  "url": page,
              }, f, ensure_ascii=False, indent=2)
          PY
          gh release upload "$TAG" release.json --clobber -R "$GITHUB_REPOSITORY"

      - name: 取消草稿（验证门与三平台产物都通过才对外可见）
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false -R "$GITHUB_REPOSITORY"
