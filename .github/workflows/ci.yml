name: CI

# PR 与主分支推送的统一验证门；check.yml 同时被 release.yml 复用。
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 验证门
    uses: ./.github/workflows/check.yml
