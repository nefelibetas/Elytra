name: 功能建议
description: 新功能或体验改进
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索现有 Issue 与 README 的功能列表，避免重复建议。
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 当前哪里不方便？请描述场景，而不是直接给实现方案。
      placeholder: 我在...时遇到...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 期望的方案
      description: 你希望启动器如何表现？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 你考虑过的其他做法或现有替代方案
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: 相关模块
      options:
        - 下载 / 安装
        - 版本与 Mod 管理
        - 账号与皮肤
        - 局域网联机
        - 工具箱
        - 界面 / 交互
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复建议
          required: true
