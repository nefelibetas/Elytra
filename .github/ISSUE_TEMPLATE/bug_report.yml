name: Bug 报告
description: 启动器崩溃、功能异常或与预期不符
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈。提交前请先搜索现有 Issue；请勿粘贴 token、账号名、服务器地址等敏感信息。
  - type: textarea
    id: summary
    attributes:
      label: 现象
      description: 实际发生了什么？你期望发生什么？
      placeholder: 简要描述问题与期望结果
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开...
        2. 点击...
        3. 观察到...
    validations:
      required: true
  - type: input
    id: launcher-version
    attributes:
      label: 启动器版本
      description: 设置页显示或安装包文件名中的版本号
      placeholder: "1.0.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: 操作系统
      options:
        - Windows 10/11
        - macOS 13+
        - Linux
        - 其他
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: 游戏版本 / ModLoader
      description: 例如 1.20.1 Fabric 0.16.9；不涉及游戏时填“无”
      placeholder: "1.20.1 Fabric 0.16.9"
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 日志（请先脱敏）
      description: 设置 → 启动器日志，打开所在目录；可粘贴或拖入文件
    validations:
      required: false
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题
          required: true
        - label: 我已移除日志中的 token、账号名与其他敏感信息
          required: true
